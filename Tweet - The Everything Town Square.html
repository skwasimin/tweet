<!DOCTYPE html>
<html lang="en" data-theme="lights-out">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Home / Tweet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ==========================================================================
       EXACT TWITTER WEB (CHIRP / SYSTEM) DESIGN TOKENS
       ========================================================================== */
    :root,
    [data-theme="lights-out"] {
      --bg: #000000;
      --bg-glass: rgba(0, 0, 0, 0.65);
      --bg-secondary: #16181c;
      --bg-search: #202327;
      --bg-hover: rgba(255, 255, 255, 0.03);
      --bg-hover-strong: rgba(231, 233, 234, 0.1);
      --bg-modal: rgba(91, 112, 131, 0.4);
      --text: #e7e9ea;
      --text-muted: #71767b;
      --border: #2f3336;
      --btn-inverse-bg: #eff3f4;
      --btn-inverse-text: #0f1419;
      --btn-inverse-hover: #d7dbdc;
      --accent: #1d9bf0;
      --accent-hover: #1a8cd8;
      --accent-soft: rgba(29, 155, 240, 0.1);
    }

    [data-theme="dim"] {
      --bg: #15202b;
      --bg-glass: rgba(21, 32, 43, 0.75);
      --bg-secondary: #1e2732;
      --bg-search: #273340;
      --bg-hover: rgba(255, 255, 255, 0.03);
      --bg-hover-strong: rgba(247, 249, 249, 0.1);
      --bg-modal: rgba(91, 112, 131, 0.4);
      --text: #f7f9f9;
      --text-muted: #8b98a5;
      --border: #38444d;
      --btn-inverse-bg: #f7f9f9;
      --btn-inverse-text: #0f1419;
      --btn-inverse-hover: #d7dbdc;
    }

    [data-theme="bright"] {
      --bg: #ffffff;
      --bg-glass: rgba(255, 255, 255, 0.85);
      --bg-secondary: #f7f9f9;
      --bg-search: #eff3f4;
      --bg-hover: rgba(15, 20, 25, 0.03);
      --bg-hover-strong: rgba(15, 20, 25, 0.1);
      --bg-modal: rgba(0, 0, 0, 0.4);
      --text: #0f1419;
      --text-muted: #536471;
      --border: #eff3f4;
      --btn-inverse-bg: #0f1419;
      --btn-inverse-text: #ffffff;
      --btn-inverse-hover: #272c30;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 20px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Hairline Borders & Surfaces */
    .tw-border { border-color: var(--border); }
    .tw-bg { background-color: var(--bg); }
    .tw-bg-secondary { background-color: var(--bg-secondary); }
    .tw-bg-search { background-color: var(--bg-search); }
    .tw-text { color: var(--text); }
    .tw-muted { color: var(--text-muted); }
    .tw-accent { color: var(--accent); }
    .tw-btn-primary {
      background-color: var(--accent);
      color: #ffffff;
      transition: background-color 0.15s ease;
    }
    .tw-btn-primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }
    .tw-btn-primary:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .tw-btn-inverse {
      background-color: var(--btn-inverse-bg);
      color: var(--btn-inverse-text);
      transition: background-color 0.15s ease;
    }
    .tw-btn-inverse:hover {
      background-color: var(--btn-inverse-hover);
    }

    /* Sticky Blurred Header */
    .tw-sticky-header {
      background-color: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Interactive Row & Nav Hovers */
    .tw-row-hover {
      transition: background-color 0.15s ease;
    }
    .tw-row-hover:hover {
      background-color: var(--bg-hover);
    }
    .tw-pill-hover {
      transition: background-color 0.15s ease;
    }
    .tw-pill-hover:hover {
      background-color: var(--bg-hover-strong);
    }

    /* Authentic Follow / Following -> Unfollow Red Hover Button */
    .tw-following-btn {
      border: 1px solid var(--border);
      color: var(--text);
      background: transparent;
      transition: all 0.15s ease;
    }
    .tw-following-btn .unfollow-label { display: none; }
    .tw-following-btn:hover {
      border-color: rgba(244, 33, 46, 0.5);
      background-color: rgba(244, 33, 46, 0.1);
      color: #f4212e;
    }
    .tw-following-btn:hover .following-label { display: none; }
    .tw-following-btn:hover .unfollow-label { display: inline; }

    /* Tweet Action Bar Icon Colors */
    .act-reply:hover { color: #1d9bf0; }
    .act-reply:hover .act-circle { background-color: rgba(29, 155, 240, 0.1); }

    .act-retweet:hover, .act-retweet.is-active { color: #00ba7c; }
    .act-retweet:hover .act-circle { background-color: rgba(0, 186, 124, 0.1); }

    .act-like:hover, .act-like.is-active { color: #f91880; }
    .act-like:hover .act-circle { background-color: rgba(249, 24, 128, 0.1); }

    .act-blue:hover, .act-blue.is-active { color: #1d9bf0; }
    .act-blue:hover .act-circle { background-color: rgba(29, 155, 240, 0.1); }

    @keyframes heartPop {
      0% { transform: scale(1); }
      35% { transform: scale(1.35); }
      70% { transform: scale(0.92); }
      100% { transform: scale(1); }
    }
    .heart-pop {
      animation: heartPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Subtle Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9999px; }

    textarea:focus, input:focus { outline: none; }
  </style>
</head>
<body>

       AUTHENTIC TWITTER WEB 3-COLUMN SHELL

          </svg>

      </div>

      <!-- Logged-in Account Switcher Pill (@skwasim) -->
      <div class="my-3 w-full">
        <div onclick="openProfile('skwasim')" class="p-3 rounded-full tw-pill-hover flex items-center justify-between cursor-pointer">

          />
        </div>
      </div>

      <div class="space-y-4">

        <section class="rounded-2xl tw-bg-secondary overflow-hidden border tw-border">

            <a href="javascript:void(0)" onclick="resetDemoState()" class="hover:underline">Reset Demo</a>
          </div>
          <div>© 2026 Tweet Corp.</div>
        </footer>
      </div>
    </aside>

    function compactNum(n) {
      if (!n && n !== 0) return '0';
      if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
      return n.toLocaleString();
    }

    function exactNum(n) {
      return Math.floor(n || 0).toLocaleString('en-US');
    }

    function esc(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function linkifyText(raw = '') {
      return esc(raw)
        .replace(/\*\*([^*]+)\*\*/g, '<strong class="font-bold">$1</strong>')
        .replace(/@([a-zA-Z0-9_]+)/g, (m, handle) => {
          return `<span onclick="event.stopPropagation(); openProfile('${handle}')" class="tw-accent hover:underline cursor-pointer">@${handle}</span>`;
        })
        .replace(/#([a-zA-Z0-9_]+)/g, (m, tag) => {
          return `<span onclick="event.stopPropagation(); runSearch('#${tag}')" class="tw-accent hover:underline cursor-pointer">#${tag}</span>`;
        })
        .replace(/\n/g, '<br/>');
    }

       ========================================================================== */
    async function callKeylessAI(systemInstruction, promptText, fallbackFn) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 4500);
      try {
        const fullPrompt = `${systemInstruction}\n\nInput: ${promptText}\nResponse:`;
        const res = await fetch(
          `https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}?model=openai&seed=${Math.floor(Math.random() * 100000)}`,
          { signal: ctrl.signal }
        );
        clearTimeout(timer);
        if (res.ok) {
          const text = (await res.text()).trim();
          if (text && text.length > 4 && !text.startsWith('<!DOCTYPE') && !text.startsWith('{')) {
            return text.replace(/^["']|["']$/g, '');
          }
        }
      } catch (e) {
        clearTimeout(timer);
      }
      return fallbackFn();
    }

          if (['home', 'thread', 'profile', 'notifications'].includes(state.view)) {
            renderCenterColumn();
          }
        }, delay);
      });
    }

    function navigate(viewId) {
      if (viewId === 'display') {
        openDisplayModal();
        return;
      }
      if (viewId === 'profile') {
        state.profileHandle = 'skwasim';
      }
      if (viewId === 'notifications') {
        state.unreadNotifs = 0;
      }
      if (viewId === 'messages' && state.dmThreads[state.activeDmHandle]) {
        state.dmThreads[state.activeDmHandle].unread = 0;
      }
      state.view = viewId;
      saveState();
      window.scrollTo({ top: 0, behavior: 'instant' });
      renderAll();
    }

    function openProfile(handle) {
      if (!state.users[handle]) return;
      state.profileHandle = handle;
      state.profileTab = 'posts';
      state.view = 'profile';
      saveState();
      window.scrollTo({ top: 0, behavior: 'instant' });
      renderAll();
    }

    function openThread(tweetId) {
      state.threadId = tweetId;
      state.view = 'thread';
      saveState();
      window.scrollTo({ top: 0, behavior: 'instant' });
      renderAll();
    }

    function openFollowList(handle, listType = 'following') {
      state.profileHandle = handle;
      state.followListType = listType;
      state.view = 'follow-list';
      saveState();
      window.scrollTo({ top: 0, behavior: 'instant' });
      renderAll();
    }

    function runSearch(query) {
      state.searchQuery = (query || '').trim();
      state.view = 'explore';
      saveState();
      renderAll();
    }

    function renderNavigation() {
      const desktopNav = document.getElementById('desktop-nav');
      if (desktopNav) {
        desktopNav.innerHTML = NAV_CONFIG.map(item => {
          const isActive = state.view === item.id && !(item.id === 'profile' && state.profileHandle !== 'skwasim');
          const badgeCount = item.badge ? item.badge() : 0;
          return `
            <button
              onclick="navigate('${item.id}')"
              class="group w-auto xl:w-full flex items-center justify-start rounded-full p-3 tw-pill-hover transition-colors"
            >
              <div class="relative flex items-center justify-center">
                ${isActive ? item.solid : item.outline}
                ${badgeCount > 0 ? `<span class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full tw-btn-primary text-[11px] font-bold flex items-center justify-center border-2 border-[var(--bg)]">${badgeCount}</span>` : ''}
              </div>
              <span class="hidden xl:inline ml-5 mr-4 text-[20px] leading-6 ${isActive ? 'font-bold' : 'font-normal'}">${item.label}</span>
            </button>
          `;
        }).join('');
      }

      const mobileNav = document.getElementById('mobile-nav');
      if (mobileNav) {
        const mobileItems = [NAV_CONFIG[0], NAV_CONFIG[1], NAV_CONFIG[4], NAV_CONFIG[2], NAV_CONFIG[3]];
        mobileNav.innerHTML = mobileItems.map(item => {
          const isActive = state.view === item.id;
          const badgeCount = item.badge ? item.badge() : 0;
          return `
            <button onclick="navigate('${item.id}')" class="relative p-2.5 rounded-full">
              ${isActive ? item.solid : item.outline}
              ${badgeCount > 0 ? `<span class="absolute top-1.5 right-1.5 min-w-[16px] h-[16px] px-1 rounded-full tw-btn-primary text-[10px] font-bold flex items-center justify-center">${badgeCount}</span>` : ''}
            </button>
          `;
        }).join('');
      }

      // Update Logged-in @skwasim pill
      const navAvatar = document.getElementById('nav-user-avatar');
      if (navAvatar) navAvatar.innerHTML = renderAvatar('skwasim', 'w-10 h-10', 'text-sm', false);
      const navName = document.getElementById('nav-user-name');
      if (navName) navName.textContent = state.users.skwasim.name;
      const navBadges = document.getElementById('nav-user-badges');
      if (navBadges) navBadges.innerHTML = renderBadges(state.users.skwasim);
    }

    function renderRightColumn() {
      const centerCol = document.getElementById('center-column');
      const rightCol = document.getElementById('right-column');

      // Authentic Twitter Messages expands center column to 990px and hides right sidebar
      if (state.view === 'messages') {
        if (centerCol) centerCol.className = 'w-full max-w-[990px] min-h-screen border-x tw-border pb-16 sm:pb-0';
        if (rightCol) rightCol.className = 'hidden';
        return;
      } else {
        if (centerCol) centerCol.className = 'w-full max-w-[600px] min-h-screen border-x tw-border pb-16 sm:pb-0';
        if (rightCol) rightCol.className = 'hidden lg:block w-[350px] shrink-0 ml-[30px] mr-[10px] pb-12';
      }

      const trendsEl = document.getElementById('right-trends');
      if (trendsEl) {
        trendsEl.innerHTML = state.trends.map(t => `
          <div onclick="runSearch('${t.query}')" class="px-4 py-3 tw-row-hover cursor-pointer flex items-start justify-between">
            <div>
              <div class="text-[13px] leading-4 tw-muted">${esc(t.category)}</div>
              <div class="font-bold text-[15px] leading-5 mt-0.5">${esc(t.topic)}</div>
              <div class="text-[13px] leading-4 tw-muted mt-0.5">${esc(t.posts)}</div>
            </div>
            <button onclick="event.stopPropagation()" class="p-1.5 -mr-1.5 rounded-full tw-muted hover:text-[var(--accent)] hover:bg-[var(--accent-soft)]">${SVG.dots}</button>
          </div>
        `).join('');
      }

      const followEl = document.getElementById('right-who-to-follow');
      if (followEl) {
        const list = Object.values(state.users).filter(u => u.handle !== 'skwasim' && u.handle !== 'Tweet').slice(0, 3);
        followEl.innerHTML = list.map(u => renderUserCompactRow(u, false)).join('');
      }
    }

    function renderUserCompactRow(u, showBio = false) {
      return `
        <div onclick="openProfile('${u.handle}')" class="px-4 py-3 tw-row-hover cursor-pointer flex items-start justify-between gap-3">
          <div class="flex items-start gap-3 min-w-0">
            ${renderAvatar(u.handle, 'w-10 h-10', 'text-sm')}
            <div class="min-w-0 leading-5">
              <div class="flex items-center gap-1 font-bold text-[15px] hover:underline truncate">
                <span class="truncate">${esc(u.name)}</span>
                ${renderBadges(u)}
              </div>
              <div class="text-[15px] tw-muted truncate">@${u.handle}</div>
              ${showBio ? `<p class="text-[15px] mt-1 leading-5 tw-text">${linkifyText(u.bio)}</p>` : ''}
            </div>
          </div>
          ${u.handle !== 'skwasim' ? renderFollowButton(u) : ''}
        </div>
      `;
    }

    function renderFollowButton(u) {
      if (u.isFollowing) {
        return `
          <button
            onclick="event.stopPropagation(); toggleFollow('${u.handle}')"
            class="tw-following-btn min-w-[98px] h-[32px] px-4 rounded-full font-bold text-[14px] shrink-0"
          >
            <span class="following-label">Following</span>
            <span class="unfollow-label">Unfollow</span>
          </button>
        `;
      }
      return `
        <button
          onclick="event.stopPropagation(); toggleFollow('${u.handle}')"
          class="tw-btn-inverse min-w-[78px] h-[32px] px-4 rounded-full font-bold text-[14px] shrink-0"
        >
          Follow
        </button>
      `;
    }

    /* ==========================================================================
       7. HOME TIMELINE & AUTHENTIC INLINE COMPOSER
       ========================================================================== */
    function renderHomeView() {
      const feedTweets = state.homeTab === 'following'
        ? state.tweets.filter(t => t.author === 'skwasim' || (state.users[t.author] && state.users[t.author].isFollowing))
        : state.tweets;

      return `
        <!-- Sticky Top Header with Mobile Bar + For you / Following Tabs -->
        <div class="sticky top-0 z-20 tw-sticky-header border-b tw-border">
          <div class="flex sm:hidden items-center justify-between px-4 h-[53px]">
            <div onclick="openProfile('skwasim')">${renderAvatar('skwasim', 'w-8 h-8', 'text-xs')}</div>
            <div onclick="navigate('home')" class="cursor-pointer">${SVG.bird}</div>
            <button onclick="openDisplayModal()" class="p-2 rounded-full tw-pill-hover">${SVG.dots}</button>
          </div>

          <div class="grid grid-cols-2 h-[53px] text-[15px]">
            <button onclick="state.homeTab='for-you'; saveState(); renderCenterColumn()" class="tw-row-hover flex items-center justify-center relative">
              <div class="h-full flex items-center relative ${state.homeTab === 'for-you' ? 'font-bold tw-text' : 'font-medium tw-muted'}">
                <span>For you</span>
                ${state.homeTab === 'for-you' ? `<div class="absolute bottom-0 inset-x-0 h-[4px] rounded-full" style="background-color:var(--accent)"></div>` : ''}
              </div>
            </button>
            <button onclick="state.homeTab='following'; saveState(); renderCenterColumn()" class="tw-row-hover flex items-center justify-center relative">
              <div class="h-full flex items-center relative ${state.homeTab === 'following' ? 'font-bold tw-text' : 'font-medium tw-muted'}">
                <span>Following</span>
                ${state.homeTab === 'following' ? `<div class="absolute bottom-0 inset-x-0 h-[4px] rounded-full" style="background-color:var(--accent)"></div>` : ''}
              </div>
            </button>
          </div>
        </div>

        <!-- Inline Composer -->
        <div class="hidden sm:block border-b tw-border">
          ${renderComposerMarkup('inline')}
        </div>

        <!-- Non-Disruptive "Show X posts" Blue Bar -->
        ${state.queuedNewTweets.length > 0 ? `
          <button
            onclick="flushQueuedTweets()"
            class="w-full h-[48px] border-b tw-border tw-row-hover text-[15px] tw-accent font-normal flex items-center justify-center"
          >
            Show ${state.queuedNewTweets.length} Tweet${state.queuedNewTweets.length > 1 ? 's' : ''}
          </button>
        ` : ''}

        <!-- Timeline Stream -->
        <div class="divide-y tw-border">
          ${feedTweets.map(t => renderTweetRow(t)).join('')}
        </div>
      `;
    }

    function renderComposerMarkup(mode = 'inline', prefill = '') {
      const inputId = mode === 'modal' ? 'modal-composer-textarea' : 'inline-composer-textarea';
      const ringId = mode === 'modal' ? 'modal-char-ring' : 'inline-char-ring';
      const countId = mode === 'modal' ? 'modal-char-count' : 'inline-char-count';
      const btnId = mode === 'modal' ? 'modal-tweet-btn' : 'inline-tweet-btn';

    function handleComposerInput(inputId, ringId, countId, btnId) {
      const el = document.getElementById(inputId);
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';

      const len = el.value.length;
      const max = 280;
      const circumference = 56.55;
      const pct = Math.min(len / max, 1);
      const offset = circumference - pct * circumference;

      const ring = document.getElementById(ringId);
      const count = document.getElementById(countId);
      if (ring) {
        ring.style.strokeDashoffset = String(offset);
        if (len >= 280) ring.style.stroke = '#f4212e';
        else if (len >= 260) ring.style.stroke = '#ffd400';
        else ring.style.stroke = 'var(--accent)';
      }
      if (count) {
        if (len >= 260) {
          count.classList.remove('hidden');
          count.textContent = String(280 - len);
          count.style.color = len >= 280 ? '#f4212e' : 'var(--text-muted)';
        } else {
          count.classList.add('hidden');
        }
      }
    }

    const TECH_PHOTO_PRESETS = [
      'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=1000&auto=format&fit=crop&q=80',
      'https://images.unsplash.com/photo-1518770660439-4636190af475?w=1000&auto=format&fit=crop&q=80',
      'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1000&auto=format&fit=crop&q=80'
    ];

    function attachPresetOrUrlImage(inputId) {
      const savedText = document.getElementById(inputId)?.value || '';
      const currentIdx = TECH_PHOTO_PRESETS.indexOf(state.composerDraftImage);
      state.composerDraftImage = TECH_PHOTO_PRESETS[(currentIdx + 1) % TECH_PHOTO_PRESETS.length];
      renderCenterColumn();
      const restored = document.getElementById(inputId);
      if (restored) restored.value = savedText;
    }

    function toggleComposerPoll(inputId) {
      const savedText = document.getElementById(inputId)?.value || '';
      state.composerDraftPoll = state.composerDraftPoll ? null : ['Yes — ship it now', 'Needs more testing'];
      renderCenterColumn();
      const restored = document.getElementById(inputId);
      if (restored) restored.value = savedText;
    }

    function insertEmojiIntoComposer(inputId) {
      const el = document.getElementById(inputId);
      if (!el) return;
      const emojis = ['🚀', '🔥', '⚡', '💯', '🐦', '📈'];
      el.value += emojis[Math.floor(Math.random() * emojis.length)];
      el.focus();
    }

    async function aiAutocompleteComposer(inputId, ringId, countId, btnId) {
      const el = document.getElementById(inputId);
      if (!el) return;
      const seed = el.value.trim();
      el.value = 'Drafting...';
      const samples = [
        'We just reduced p99 timeline latency on Tweet to 38ms across 300,000,000 active users.\n\nSmall, high-velocity engineering teams beat bloated committees every time.',
        'WasimAI 2.5 is now processing live context across every public conversation on Tweet.\n\nTry asking it a hard technical question and compare the speed.',
        'Doubling creator revenue share payouts starting this week. If you create high-signal content on Tweet, you should own the upside.'
      ];
      const text = await callKeylessAI(
        `You are Sk Wasim (@skwasim), Owner & CEO of Tweet (300M active users, 138.4M followers) and creator of WasimAI. Write a crisp, authentic tech CEO tweet under 220 characters. No hashtags.`,
        seed || 'Write a high-signal CEO update about Tweet or WasimAI.',
        () => samples[Math.floor(Math.random() * samples.length)]
      );
      el.value = text;
      handleComposerInput(inputId, ringId, countId, btnId);
      el.focus();
    }

    function publishTweet(inputId, isModal = false) {
      const el = document.getElementById(inputId);
      const text = el ? el.value.trim() : '';
      if (!text && !state.composerDraftImage && !state.composerQuoteId) return;

      let pollObj = null;
      if (state.composerDraftPoll) {
        const validOpts = state.composerDraftPoll.map(s => s.trim()).filter(Boolean);
        if (validOpts.length >= 2) {
          pollObj = {
            totalVotes: 0,
            votedIndex: null,
            options: validOpts.map(label => ({ label, votes: Math.floor(240 + Math.random() * 900) }))
          };
          pollObj.totalVotes = pollObj.options.reduce((acc, o) => acc + o.votes, 0);
        }
      }

      const newTweet = {
        id: 'tw-' + Date.now(),
        author: 'skwasim',
        text,
        time: '1s',
        fullDate: '2:22 PM · Nov 15, 2026',
        views: 12400,
        likes: 890,
        retweets: 140,
        bookmarks: 65,
        liked: false,
        retweeted: false,
        bookmarked: false,
        pinned: false,
        imageUrl: state.composerDraftImage,
        poll: pollObj,
        quoteTweetId: state.composerQuoteId,
        replies: []
      };

      state.tweets.unshift(newTweet);
      state.composerDraftImage = null;
      state.composerDraftPoll = null;
      state.composerQuoteId = null;
      state.composerFocused = false;

      // Immediate CEO follower & impression bump
      state.users.skwasim.followers += Math.floor(1800 + Math.random() * 4200);
      state.platformUsers += Math.floor(900 + Math.random() * 2500);
      saveState();

      if (isModal) closeModal();
      state.view = 'home';
      renderAll();
      toast('Your Tweet was sent.');

      // Schedule realistic multi-turn crowd replies to @skwasim
      scheduleCrowdRepliesToTweet(newTweet);
    }

    function renderPollBox(tweet) {
      const p = tweet.poll;
      return `

          ${p.options.map((opt, idx) => {
            const pct = p.totalVotes > 0 ? Math.round((opt.votes / p.totalVotes) * 100) : 0;
            const isChosen = p.votedIndex === idx;
            return `
              <button

    function toggleReplyLike(tweetId, replyId) {
      const t = state.tweets.find(x => x.id === tweetId);
      if (!t) return;
      const r = t.replies.find(x => x.id === replyId);
      if (!r) return;
      r.liked = !r.liked;
      r.likes += r.liked ? 1 : -1;
      saveState();
      renderCenterColumn();
    }

    function replyToSpecificComment(handle) {
      const box = document.getElementById('thread-reply-box');
      if (!box) return;
      box.value = `@${handle} `;
      box.dataset.replyTarget = handle;
      box.focus();
    }

    async function aiDraftReply(tweetId) {
      const t = state.tweets.find(x => x.id === tweetId);
      const box = document.getElementById('thread-reply-box');
      if (!t || !box) return;
      box.value = 'Drafting...';
      const draft = await callKeylessAI(
        `You are Sk Wasim (@skwasim), CEO of Tweet. Write a sharp, concise 1-sentence reply to this post.`,
        t.text,
        () => 'Rolling out an optimization for this in tonight’s build.'
      );
      box.value = draft;
      box.focus();
    }

    function submitReplyToThread(tweetId) {
      const t = state.tweets.find(x => x.id === tweetId);
      const box = document.getElementById('thread-reply-box');
      if (!t || !box) return;
      const text = box.value.trim();
      if (!text) return;

      // Detect if @skwasim mentioned a specific user or is replying to the thread author
      const mentionMatch = text.match(/^@([a-zA-Z0-9_]+)/);
      const targetHandle = (mentionMatch && state.users[mentionMatch[1]])
        ? mentionMatch[1]
        : (t.author !== 'skwasim' ? t.author : 'karpathy');

      t.replies.unshift({
        id: 'rep-' + Date.now(),
        author: 'skwasim',
        text,
        time: 'Just now',
        likes: 640,
        retweets: 82,
        views: 19400,
        liked: false
      });

      saveState();
      renderCenterColumn();
      toast('Your reply was sent.');

      // Trigger multi-turn response back from the target user
      scheduleCrowdRepliesToTweet(t, targetHandle);
    }

    function selectDmThread(handle) {
      state.activeDmHandle = handle;

      saveState();
      renderNavigation();
      renderCenterColumn();
    }

    function openDmConversation(handle) {
      if (!state.dmThreads[handle]) {
        state.dmThreads[handle] = {
          handle,
          pinned: false,
          unread: 0,
          lastTime: 'Now',
          messages: []
        };
      }
      state.activeDmHandle = handle;
      state.mobileDmListOpen = false;
      navigate('messages');
    }

    function loadBriefItemIntoComposer(briefId) {
      const msg = state.dmThreads.Tweet.messages[0];
      const item = msg.briefItems.find(b => b.id === briefId);
      if (!item) return;
      state.composerDraftImage = item.imageUrl || null;
      state.composerDraftPoll = item.poll ? [...item.poll] : null;
      openComposeModal(item.draft);
    }

    async function sendDmMessage() {
      const input = document.getElementById('dm-chat-input');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;

      const handle = state.activeDmHandle;
      const th = state.dmThreads[handle];
      th.messages.push({
        id: 'dm-' + Date.now(),
        sender: 'skwasim',
        time: 'Just now',
        text
      });
      th.lastTime = 'Just now';
      input.value = '';
      saveState();
      renderCenterColumn();

      const partner = state.users[handle] || state.users.Tweet;
      setTimeout(async () => {
        const reply = await callKeylessAI(
          `You are ${partner.name} (@${partner.handle}) in a direct message with Tweet CEO Sk Wasim (@skwasim). Reply naturally in 1-2 short sentences.`,
          text,
          () => `Sounds good @skwasim — let’s sync on this later today.`
        );
        th.messages.push({
          id: 'dm-' + Date.now(),
          sender: handle,
          time: 'Just now',
          text: reply
        });
        saveState();
        if (state.view === 'messages') renderCenterColumn();
      }, 1800);
    }

    async function sendWasimAiPrompt(preset) {
      const input = document.getElementById('wasimai-prompt-input');
      const prompt = preset || (input ? input.value.trim() : '');
      if (!prompt) return;
      if (input) input.value = '';

      state.wasimAiMessages.push({ role: 'user', text: prompt });
      state.wasimAiMessages.push({ role: 'assistant', text: 'Analyzing real-time Tweet firehose...' });
      renderCenterColumn();

      const style = state.wasimAiMode === 'fun'
        ? 'witty, sharp, slightly unhinged, zero corporate speak'
        : 'clear, analytical, direct';

      const ans = await callKeylessAI(
        `You are WasimAI 2.5 on Tweet (300M users), created by Sk Wasim (@skwasim). Tone: ${style}. Keep under 85 words.`,
        prompt,
        () => `Across Tweet’s 300,000,000 active users right now:\n\n1. **@skwasim** passing 138.4M followers is the #1 global topic.\n2. Engineers are benchmarking **WasimAI 2.5** against legacy models.\n3. Creators are posting their doubled ad-revenue payouts.`
      );

      state.wasimAiMessages[state.wasimAiMessages.length - 1].text = ans;
      saveState();
      if (state.view === 'wasimai') renderCenterColumn();
    }

            </div>
          </div>
        </div>
      `);
    }

    /* ==========================================================================
       15. MASTER RENDERER & REAL-TIME TIMELINE QUEUE
       ========================================================================== */
    function renderCenterColumn() {
      const center = document.getElementById('center-column');
      if (!center) return;

      switch (state.view) {
        case 'home':
          center.innerHTML = renderHomeView();
          break;
        case 'thread':
          center.innerHTML = renderThreadView();
          break;
        case 'profile':
          center.innerHTML = renderProfileView();
          break;
        case 'follow-list':
          center.innerHTML = renderFollowListView();
          break;
        case 'messages':
          center.innerHTML = renderMessagesView();
          break;
        case 'wasimai':
          center.innerHTML = renderWasimAiView();
          break;
        case 'explore':
          center.innerHTML = renderExploreView();
          break;
        case 'notifications':
          center.innerHTML = renderNotificationsView();
          break;
        case 'bookmarks':
          center.innerHTML = renderBookmarksView();
          break;
        case 'monetization':
          center.innerHTML = renderMonetizationView();
          break;
        default:
          center.innerHTML = renderHomeView();
      }
    }

    function renderAll() {
      renderNavigation();
      renderRightColumn();
      renderCenterColumn();
    }

    function flushQueuedTweets() {
      if (!state.queuedNewTweets.length) return;
      state.tweets.unshift(...state.queuedNewTweets);
      state.queuedNewTweets = [];
      saveState();
      renderCenterColumn();
    }

    /* Background Live Activity Queue (Non-disruptive "Show X Tweets" bar) */
    function startLiveSimulator() {
      setInterval(async () => {
        state.users.skwasim.followers += Math.floor(25 + Math.random() * 110);
        state.platformUsers += Math.floor(80 + Math.random() * 340);

        if (state.queuedNewTweets.length < 4 && Math.random() < 0.45) {
          const pool = ['paulg', 'karpathy', 'mkbhd', 'sama', 'levelsio', 'garrytan', 'naval'];
          const author = pool[Math.floor(Math.random() * pool.length)];
          const u = state.users[author];
          const fallbacks = [
            'The timeline speed on @Tweet since crossing 300M users is noticeably snappier.',
            'Using @WasimAI to summarize 80-comment engineering threads in 2 seconds is a superpower.',
            'High-signal discussions are all happening on @Tweet right now.'
          ];
          const text = await callKeylessAI(
            `You are ${u.name} (@${u.handle}) on Tweet (owned by @skwasim, 300M users). Write a realistic 1-sentence tweet in character. No hashtags.`,
            'Post a new thought to the timeline.',
            () => fallbacks[Math.floor(Math.random() * fallbacks.length)]
          );

          state.queuedNewTweets.unshift({
            id: 'tw-' + Date.now(),
            author,
            text,
            time: '1m',
            fullDate: '2:25 PM · Nov 15, 2026',
            views: Math.floor(28000 + Math.random() * 210000),
            likes: Math.floor(900 + Math.random() * 8200),
            retweets: Math.floor(90 + Math.random() * 900),
            bookmarks: Math.floor(40 + Math.random() * 450),
            liked: false,
            retweeted: false,
            bookmarked: false,
            pinned: false,
            imageUrl: null,
            poll: null,
            quoteTweetId: null,
            replies: []
          });
          if (state.view === 'home' && !state.composerFocused) {
            renderCenterColumn();
          }
        }
      }, 14000);
    }

    window.onload = function () {
      applyThemeAndAccent();
      renderAll();
      startLiveSimulator();
    };
  </script>
</body>
